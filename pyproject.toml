[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-use"
version = "0.1.0"
description = "Native computer-use CLI and MCP server (macOS / Windows / Linux)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "computer-use" }]
dependencies = ["pillow>=10"]

[project.scripts]
computer-use = "computer_use.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
